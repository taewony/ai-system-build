<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Sort Visualization</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --bar-default: #8e9eab;
            --bar-pivot: #3498db;
            --bar-swap: #e74c3c;
            --bar-sorted: #2ecc71;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        h1 { margin-bottom: 10px; }

        .controls {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        button {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-start { background-color: #2ecc71; color: white; }
        .btn-start:hover { background-color: #27ae60; }
        
        .btn-reset { background-color: #95a5a6; color: white; }
        .btn-reset:hover { background-color: #7f8c8d; }

        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .array-container {
            width: 90%;
            max-width: 800px;
            height: 300px;
            background: white;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            align-items: flex-end; /* Align bars to bottom */
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
        }

        .bar {
            width: 12px;
            margin: 0 2px;
            background-color: var(--bar-default);
            border-radius: 2px 2px 0 0;
            transition: height 0.1s ease, background-color 0.1s ease;
        }

        .status {
            margin-top: 10px;
            font-weight: bold;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>Quick Sort Visualization</h1>

    <div class="controls">
        <button id="btnStart" class="btn-start">Sort Array</button>
        <button id="btnReset" class="btn-reset">Reset / New Array</button>
        
        <div class="speed-control">
            <label for="speedRange">Speed:</label>
            <input type="range" id="speedRange" min="10" max="300" value="100">
            <span id="speedValue">100ms</span>
        </div>
    </div>

    <div class="array-container" id="arrayContainer">
        <!-- Bars will be injected here -->
    </div>

    <div class="status" id="statusText">Ready to sort</div>

    <script>
        /**
         * Quick Sort Visualization Logic
         * Uses async/await and requestAnimationFrame concepts (via browser paint cycle)
         */

        const container = document.getElementById('arrayContainer');
        const statusText = document.getElementById('statusText');
        const btnStart = document.getElementById('btnStart');
        const btnReset = document.getElementById('btnReset');
        const speedRange = document.getElementById('speedRange');
        const speedValue = document.getElementById('speedValue');

        // Configuration
        const ARRAY_SIZE = 50;
        let arrayData = [];
        let isSorting = false;

        // Utility: Delay function to control animation speed
        const delay = (ms) => new Promise(resolve => setTimeout(resolve, ms));

        // Update slider text
        speedRange.addEventListener('input', (e) => {
            speedValue.textContent = `${e.target.value}ms`;
        });

        // Generate random array
        function generateArray() {
            arrayData = [];
            for (let i = 0; i < ARRAY_SIZE; i++) {
                arrayData.push(Math.floor(Math.random() * 80) + 10); // Height between 10 and 90%
            }
            renderArray();
        }

        // Render the bars to DOM
        function renderArray() {
            container.innerHTML = '';
            arrayData.forEach((height, index) => {
                const bar = document.createElement('div');
                bar.classList.add('bar');
                bar.style.height = `${height}%`;
                bar.id = `bar-${index}`;
                container.appendChild(bar);
            });
        }

        // Helper to get delay based on slider
        async function getDelay() {
            const speed = parseInt(speedRange.value);
            return Math.max(10, 310 - speed); // Invert logic: higher value = faster sort (lower delay)
        }

        /**
         * Partition Logic for Quick Sort
         * @param {number} low 
         * @param {number} high 
         */
        async function partition(low, high) {
            const pivotIndex = high;
            const pivotValue = arrayData[high];

            // Highlight Pivot
            await updateBarColor(pivotIndex, 'pivot');
            
            let i = low - 1;

            for (let j = low; j < high; j++) {
                // Check if element is smaller than pivot
                if (arrayData[j] < pivotValue) {
                    i++;
                    
                    // Swap if indices are different
                    if (i !== j) {
                        await swap(i, j);
                    }
                }
            }

            // Place pivot in correct position
            await swap(i + 1, high);

            return i + 1;
        }

        /**
         * Quick Sort Recursive Function
         */
        async function quickSort(low, high) {
            if (low < high) {
                const pi = await partition(low, high);
                
                // Recursively sort elements before partition element
                await quickSort(low, pi - 1);
                
                // Recursively sort elements after partition element
                await quickSort(pi + 1, high);
            }
        }

        /**
         * Swap two elements and update UI
         */
        async function swap(i, j) {
            if (i === j) return;

            statusText.textContent = `Swapping index ${i} with index ${j}`;

            // Visualize swap
            const barI = document.getElementById(`bar-${i}`);
            const barJ = document.getElementById(`bar-${j}`);
            
            // Mark as swapping (red)
            await updateBarColor(i, 'swap');
            await updateBarColor(j, 'swap');

            // Perform actual swap in data
            [arrayData[i], arrayData[j]] = [arrayData[j], arrayData[i]];

            // Update heights
            barI.style.height = `${arrayData[i]}%`;
            barJ.style.height = `${arrayData[j]}%`;

            // Reset colors after a brief moment (handled by next step or loop)
            await delay(10); 
        }

        /**
         * Update visual styles of a bar
         */
        async function updateBarColor(index, status) {
            const bar = document.getElementById(`bar-${index}`);
            
            // Remove existing classes to reset
            bar.classList.remove('sorted');
            
            if (status === 'pivot') {
                bar.style.backgroundColor = 'var(--bar-pivot)';
            } else if (status === 'swap') {
                bar.style.backgroundColor = 'var(--bar-swap)';
            } else {
                // Default state is handled by CSS, but we need to ensure it's not sorted yet
                bar.style.backgroundColor = ''; 
            }

            await delay(20); // Allow browser to render color change
        }

        /**
         * Mark array as sorted (green)
         */
        async function markSorted() {
            for(let i=0; i<arrayData.length; i++) {
                const bar = document.getElementById(`bar-${i}`);
                bar.style.backgroundColor = 'var(--bar-sorted)';
                bar.classList.add('sorted');
            }
            statusText.textContent = "Sorting Complete!";
        }

        // Main Start Function
        async function startSort() {
            if (isSorting) return;
            
            isSorting = true;
            btnStart.disabled = true;
            btnReset.disabled = true;
            statusText.textContent = "Sorting...";

            await quickSort(0, arrayData.length - 1);
            await markSorted();

            isSorting = false;
            btnStart.disabled = false;
            btnReset.disabled = false;
        }

        // Event Listeners
        btnStart.addEventListener('click', startSort);
        
        btnReset.addEventListener('click', () => {
            if (isSorting) return;
            generateArray();
            statusText.textContent = "Ready to sort";
        });

        // Initialize
        generateArray();

    </script>
</body>
</html>
